[package]
name = "atlas-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "wist-atlas"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
orion-error.workspace = true
serde.workspace = true
serde_json.workspace = true
atlas-api = { path = "../atlas-api" }
atlas-domain = { path = "../atlas-domain" }
atlas-storage = { path = "../atlas-storage" }
atlas-sync = { path = "../atlas-sync" }
atlas-wist-ingest = { path = "../atlas-wist-ingest" }
tokio.workspace = true
uuid.workspace = true
# OpenAPI 3.1：编译期从 handler 标注与 DTO 的 `ToSchema` 生成，
# 不靠手写 spec（手写那份必然跟着 DTO 漂）。
utoipa = { version = "6", features = ["macros", "uuid", "chrono"] }
utoipa-axum = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
