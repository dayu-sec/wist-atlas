name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  docker:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：国内服务器拉 ghcr.io 很慢，客户端改用 TCR 地址。
      # 凭据在 TCR 控制台生成（访问凭证，需 push 权限），存 GitHub Secrets：
      # TCR_USERNAME / TCR_PASSWORD；仓库也要先在 TCR 控制台建好（namespace `cloud`）。
      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.2.0-alpha 等）只推该 tag，不覆盖 :latest。
          # 两个源（ghcr / TCR）同进退：客户端只选一个地址，不该出现“一边有一边没有”。
          tcr="dy-sec.tencentcloudcr.com/cloud/${{ github.event.repository.name }}"
          tags="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          tags="$(printf '%s\n%s' "$tags" "$tcr:${{ github.ref_name }}")"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              tags="$(printf '%s\n%s' "$tags" "ghcr.io/${{ github.repository }}:latest")"
              tags="$(printf '%s\n%s' "$tags" "$tcr:latest")"
              ;;
          esac
          printf 'tags<<__EOF__\n%s\n__EOF__\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
