services:
  postgres:
    image: postgres:16
    container_name: wist-atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wist_atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 主机端口可覆盖：本机已有其它产品的 postgres 占着 55432 时用
      # `ATLAS_PG_PORT=55437 docker compose up -d`，同时记得给 DATABASE_URL 对应端口。
      - "${ATLAS_PG_PORT:-55432}:5432"
    volumes:
      - wist_atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d wist_atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wist_atlas_pgdata:
