[workspace]
members = [
  "crates/atlas-domain",
  "crates/atlas-storage",
  "crates/atlas-api",
  "crates/atlas-sync",
  "crates/atlas-app",
  "crates/atlas-wist-adapter",
  "crates/atlas-wist-ingest",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.2.0"
authors = ["wist-atlas contributors"]

[workspace.dependencies]
axum = "0.8"
orion-error = { version ="0.8", features = ["derive", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
